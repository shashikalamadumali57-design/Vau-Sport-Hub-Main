# Server Configuration
server.port=8080

# =============================================
# MySQL Database Configuration
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/sportshubdb?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Configuration
# =============================================
app.jwtSecret=vavSportHubSuperSecretKeyForJwtAuthenticationShouldBeLongEnough
app.jwtExpirationMs=86400000

# Scheduling
spring.task.scheduling.enabled=true
